<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transportes Girardota S.A. — Dashboard de Operaciones</title>
<style>
:root{
  --green-900:#0d3b20; --green-800:#14532d; --green-700:#166534;
  --green-600:#15803d; --green-500:#16a34a; --green-400:#22c55e;
  --green-300:#4ade80; --green-200:#86efac; --green-100:#bbf7d0;
  --green-50:#f0fdf4; --black:#111111; --gray:#555555; --line:#e4e4e4;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff;color:var(--black);overflow:hidden;}
.app-header{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  min-height:82px;padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:#fff;border-bottom:3px solid var(--green-600);
  box-shadow:0 3px 12px rgba(0,0,0,.10);
}
.brand{display:flex;align-items:center;gap:12px;min-width:280px;}
.brand .logo{width:46px;height:46px;border-radius:10px;object-fit:cover;display:block;box-shadow:0 2px 4px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.06);background:#0b1f3a;}
.brand h1{font-size:19px;margin:0;font-weight:bold;color:var(--black);}
.brand .sub{font-size:12px;color:var(--gray);margin-top:2px;}
.top-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end;}
.action-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.action-divider{width:1px;align-self:stretch;min-height:28px;background:var(--line);}
.user-pill{display:flex;align-items:center;gap:6px;font-size:11px;padding:5px 10px 5px 8px;border-radius:20px;background:#f4f6f5;border:1px solid var(--line);color:var(--gray);white-space:nowrap;}
.user-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--green-500);flex-shrink:0;}
.user-pill b{color:var(--black);font-weight:bold;}
.lock-note{font-size:10.5px;color:var(--gray);display:none;align-items:center;gap:4px;white-space:nowrap;}
.status-pill{font-size:11px;padding:5px 10px;border-radius:20px;background:var(--green-50);border:1px solid var(--green-200);color:var(--green-800);white-space:nowrap;max-width:290px;overflow:hidden;text-overflow:ellipsis;}
button{font-family:Arial,Helvetica,sans-serif;cursor:pointer;border-radius:8px;border:none;color:#fff;padding:10px 16px;font-size:13px;font-weight:bold;letter-spacing:.01em;background:linear-gradient(180deg,var(--green-500) 0%,var(--green-600) 55%,var(--green-700) 100%);box-shadow:0 3px 0 var(--green-900),0 6px 14px rgba(13,59,32,.30),inset 0 1px 0 rgba(255,255,255,.25);}
button:hover{transform:translateY(-1px);}
button.secondary{background:linear-gradient(180deg,#fff 0%,#f3f4f6 100%);color:var(--green-700);box-shadow:0 3px 0 #cfd3d6,0 6px 12px rgba(0,0,0,.10),inset 0 1px 0 #fff;}
button.ghost{background:linear-gradient(180deg,#fff 0%,#f7f7f7 100%);color:var(--gray);font-weight:normal;box-shadow:0 2px 0 #ddd,0 4px 8px rgba(0,0,0,.06);}
.upload-locked{opacity:.45;cursor:not-allowed !important;pointer-events:none;}
iframe#dashboardFrame{position:fixed;left:0;right:0;bottom:0;top:82px;width:100%;height:calc(100% - 82px);border:0;background:#fff;}
@media (max-width:1000px){
  .app-header{padding:10px 12px;}
  .brand h1{font-size:15px;}
  .brand .sub{display:none;}
  .status-pill{max-width:180px;}
}
@media (max-width:760px){
  .app-header{position:fixed;}
  .brand{min-width:auto;}
  .brand .logo{width:38px;height:38px;}
  .top-actions{gap:6px;}
  .action-divider{display:none;}
  button{padding:8px 11px;font-size:11px;}
  .user-pill{font-size:10px;}
  iframe#dashboardFrame{top:122px;height:calc(100% - 122px);}
}
.btn-logout{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:9px 13px;
  color:#555;
  background:#fff;
  border:1px solid #d9d9d9;
  border-radius:8px;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  transition:all .18s ease;
  box-shadow:0 2px 5px rgba(0,0,0,.06);
}

.btn-logout:hover{
  color:#b91c1c;
  border-color:#fca5a5;
  background:#fff5f5;
  box-shadow:0 3px 8px rgba(185,28,28,.12);
  transform:translateY(-1px);
}

.btn-logout:active{
  transform:translateY(0);
  box-shadow:0 1px 3px rgba(0,0,0,.08);
}
</style>
</head>

    <div>
      <h1>Transportes Girardota S.A.</h1>
      <div class="sub">Dashboard de Operaciones · Manifiestos de Carga</div>
    </div>
  </div>

  <div class="top-actions">
    <div class="action-group">
      <span class="status-pill" id="dataStatusShell">Cargando datos…</span>
      <button class="secondary" id="btnRestoreShell" type="button" style="display:none;">Restaurar datos originales</button>
      <button id="btnUploadShell" type="button">Cargar Excel del día</button>
      <span class="lock-note" id="lockNoteShell">🔒 Solo autorizados pueden cargar archivos</span>
    </div>

    <div class="action-divider"></div>

    <div class="action-group">
      <span class="user-pill" id="userLabel"><span class="dot"></span><b></b></span>
      <button id="btnLogout" class="btn-logout" type="button"> Cerrar sesión </button>
    </div>
  </div>
</header>

<iframe id="dashboardFrame" src="./dashboardInfo.html" title="Dashboard de Operaciones"></iframe>

<script>
(function(){
  const AUTH_KEY = 'transgirar_auth';
  const ALLOWED_UPLOADERS = ['andres.gil', 'emadrid3'];

  function currentUser(){
    return (sessionStorage.getItem(AUTH_KEY) || '').trim();
  }

  function requireAuth(){
    const user = currentUser();
    if (!user){
      window.location.href = './login.html';
      return null;
    }
    return user;
  }

  const user = requireAuth();
  if (!user) return;

  document.querySelector('#userLabel b').textContent = user;

  function canUpload(){
    return ALLOWED_UPLOADERS.includes(user.toLowerCase());
  }

  const frame = document.getElementById('dashboardFrame');
  const uploadBtn = document.getElementById('btnUploadShell');
  const restoreBtn = document.getElementById('btnRestoreShell');
  const statusEl = document.getElementById('dataStatusShell');
  const lockEl = document.getElementById('lockNoteShell');

  function dashboardDoc(){
    try { return frame.contentDocument || frame.contentWindow.document; }
    catch(e) { return null; }
  }

  function syncPermission(){
    const allowed = canUpload();
    uploadBtn.disabled = !allowed;
    uploadBtn.classList.toggle('upload-locked', !allowed);
    lockEl.style.display = allowed ? 'none' : 'inline-flex';
    if (!allowed) uploadBtn.title = 'Solo andres.gil o emadrid3 pueden cargar un nuevo archivo';
    else uploadBtn.removeAttribute('title');
  }

  function syncFromDashboard(){
    const doc = dashboardDoc();
    if (!doc) return;

    syncPermission();

    const innerUpload = doc.getElementById('btnUpload');
    const innerRestore = doc.getElementById('btnRestore');
    const innerStatus = doc.getElementById('dataStatus');

    if (innerStatus) statusEl.textContent = innerStatus.textContent || 'Datos cargados';

    if (innerRestore) {
      restoreBtn.style.display = innerRestore.style.display === 'none' ? 'none' : 'inline-block';
    }

    if (innerStatus && !innerStatus.dataset.headerObserver) {
      const observer = new MutationObserver(function(){
        statusEl.textContent = innerStatus.textContent || 'Datos cargados';
      });
      observer.observe(innerStatus, {childList:true,characterData:true,subtree:true});
      innerStatus.dataset.headerObserver = '1';
    }

    if (innerRestore && !innerRestore.dataset.headerObserver) {
      const observer = new MutationObserver(function(){
        restoreBtn.style.display = innerRestore.style.display === 'none' ? 'none' : 'inline-block';
      });
      observer.observe(innerRestore, {attributes:true,attributeFilter:['style']});
      innerRestore.dataset.headerObserver = '1';
    }
  }

  uploadBtn.addEventListener('click', function(){
    if (!canUpload()) return;
    const doc = dashboardDoc();
    const innerUpload = doc && doc.getElementById('btnUpload');
    if (innerUpload) innerUpload.click();
  });

  restoreBtn.addEventListener('click', function(){
    const doc = dashboardDoc();
    const innerRestore = doc && doc.getElementById('btnRestore');
    if (innerRestore) innerRestore.click();
  });

  document.getElementById('btnLogout').addEventListener('click', function(){
    sessionStorage.removeItem(AUTH_KEY);
    window.location.href = './login.html';
  });

  frame.addEventListener('load', function(){
    setTimeout(syncFromDashboard, 50);
  });

  syncPermission();
})();
</script>
