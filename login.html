<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Transgirar S.A.</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios-filled/50/2ecc71/truck.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-emerald-950 text-gray-800 min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-2 text-2xl font-bold text-white">
                <i class="fa-solid fa-truck-fast text-emerald-400 text-xl"></i>
                <span>Transgirar S.A.</span>
            </a>
            <p class="text-emerald-200 mt-2 text-sm">Acceso restringido</p>
        </div>

        <form id="login-form" class="bg-white rounded-2xl shadow-2xl p-8 space-y-5">
            <div>
                <label for="username" class="block text-sm font-semibold text-gray-700 mb-1">Usuario</label>
                <input id="username" name="username" type="text" autocomplete="username" required
                    class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required
                    class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
            </div>

            <div id="error-box" class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-4 py-2"></div>

            <button type="submit" id="submit-btn"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition duration-150 shadow-md">
                Ingresar
            </button>
        </form>

        <p class="text-center text-emerald-300 text-xs mt-6">
            <a href="/" class="hover:text-white transition">&larr; Volver al sitio</a>
        </p>
    </div>

    <script src="./assets/auth.js"></script>
    <script>
        const form = document.getElementById('login-form');
        const errorBox = document.getElementById('error-box');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Verificando...';

            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            try {
                const users = await loadUsers();
                const entry = users.find(u => u.username === username);

                let ok = false;
                if (entry) {
                    ok = await verifyLogin(entry, password);
                } else {
                    // Igual se hace un intento de descifrado "señuelo" para no revelar
                    // por tiempo de respuesta si el usuario existe o no.
                    await verifyLogin({ salt: btoa("0".repeat(16)), iv: btoa("0".repeat(12)), data: btoa("0".repeat(16)) }, password).catch(() => {});
                }

                if (ok) {
                    sessionStorage.setItem('transgirar_auth', username);
                    window.location.href = './dashboard.html';
                } else {
                    errorBox.textContent = 'Usuario o contraseña incorrectos';
                    errorBox.classList.remove('hidden');
                }
            } catch (err) {
                errorBox.textContent = 'No se pudo leer la base de usuarios (site-data.txt).';
                errorBox.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Ingresar';
            }
        });
    </script>
</body>
</html>
